<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactividad con el DOM</title>

    <!-- Conexión con CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="tarjeta">

        <h1>Interactividad con el DOM</h1>

        <p class="descripcion">

            Haz clic en el botón para incrementar el contador

            y registrar la hora exacta del evento en la tabla.

        </p>

        <!-- Contador -->

        <div id="contador" class="contador">0</div>

        <!-- Botón -->

        <button id="botonClic" type="button">

            ¡Haz Clic Aquí!

        </button>

        <!-- Tabla de registros -->

        <table>

            <thead>

                <tr>

                    <th>N° Clic</th>

                    <th>Hora</th>

                </tr>

            </thead>

            <tbody id="tablaRegistros">

                <!-- Los registros aparecerán aquí -->

            </tbody>

        </table>

    </main>

    <!-- Conexión con JavaScript -->

    <script src="js.js"></script>

</body>

</html>
